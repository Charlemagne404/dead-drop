name: Drop CI and release preparation

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Build native installers and prepare a downloadable artifact bundle
        required: false
        default: false
        type: boolean
      attest:
        description: Request GitHub artifact provenance attestation for regular package files
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: drop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  RUST_BACKTRACE: "1"

jobs:
  fast-validation:
    name: Fast validation
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate workflow YAML
        run: npm run check:workflows

      - name: Validate release metadata
        run: npm run release:check

      - name: Test release tooling
        run: npm run test:release

      - name: Build frontend
        run: npm run build

      - name: Validate Cargo metadata
        run: cargo metadata --locked --manifest-path src-tauri/Cargo.toml --no-deps

  platform-checks:
    name: Native checks (${{ matrix.name }})
    needs: fast-validation
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - name: Linux x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run release:check -- --target "${{ matrix.target }}"

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target "${{ matrix.target }}"

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target "${{ matrix.target }}" --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target "${{ matrix.target }}"

      - name: Run transfer integration tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features integration-tests --test transfer_integration --target "${{ matrix.target }}" -- --test-threads=1

  package:
    name: Package (${{ matrix.name }})
    needs:
      - fast-validation
      - platform-checks
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.package == true) ||
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Linux x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release.mjs verify-tag "${{ github.ref_name }}"

      - name: Build native bundles
        run: npm run tauri -- build --ci --no-sign --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"

      - name: Audit generated bundles
        run: npm run release:audit -- --target "${{ matrix.target }}" --path "src-tauri/target/${{ matrix.target }}/release/bundle"

      - name: Upload unsigned platform bundles
        uses: actions/upload-artifact@v7
        with:
          name: drop-unsigned-bundles-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

  prepare-artifacts:
    name: Prepare release artifacts
    needs: package
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.package == true) ||
        startsWith(github.ref, 'refs/tags/v')
      }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release.mjs verify-tag "${{ github.ref_name }}"

      - name: Download platform bundles
        uses: actions/download-artifact@v8
        with:
          pattern: drop-unsigned-bundles-*
          path: .release-output-input
          merge-multiple: false

      - name: Prepare notes, checksums, and manifest
        run: npm run release:prepare-artifacts -- --input .release-output-input --output .release-output

      - name: Attest regular package files when explicitly requested
        if: inputs.attest == true
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ github.workspace }}/.release-output/SHA256SUMS.txt

      - name: Upload release-preparation bundle
        uses: actions/upload-artifact@v7
        with:
          name: drop-release-preparation
          path: .release-output
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
