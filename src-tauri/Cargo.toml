[package]
name = "dead-drop"
version = "0.1.0"
description = "Direct local file transfer"
authors = ["Continental"]
edition = "2021"

[lib]
name = "dead_drop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
integration-tests = []

[build-dependencies]
tauri-build = { version = "2", default-features = false, features = ["config-json"] }

[dependencies]
directories = "6"
hostname = "0.4"
libc = "0.2"
mdns-sd = { version = "0.21", default-features = false, features = ["logging"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11", default-features = false, features = ["wry", "compression", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
tauri-plugin-dialog = { version = "2.7", default-features = false, features = ["gtk3"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
unicode-normalization = "0.1"
uuid = { version = "1", default-features = false, features = ["std", "v4", "serde"] }

[dev-dependencies]
proptest = "1"

[[test]]
name = "transfer_integration"
path = "tests/transfer_integration.rs"
required-features = ["integration-tests"]

[[test]]
name = "chaos_integration"
path = "tests/chaos_integration.rs"
required-features = ["integration-tests"]
